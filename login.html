<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>SkillSwap | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-wrapper {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background: #151e32;
            border: 1px solid #6554a4;
            border-radius: 20px;
            box-shadow: 0 15px 50px #0008;
        }

        .auth-box h1,
        .auth-box h2 {
            text-align: center;
        }

        .auth-box h1 {
            font-size: 27px;
        }

        .auth-box p {
            text-align: center;
            color: #cbd5e1;
        }

        .auth-box form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-box form[hidden] {
            display: none !important;
        }

        .auth-box label {
            color: white;
        }

        .auth-box input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0b1020;
            color: white;
        }

        .auth-box button {
            padding: 13px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .primary-btn {
            background: #8b5cf6;
            color: white;
        }

        .google-btn {
            width: 100%;
            background: white;
            color: #222;
            margin-top: 15px;
        }

        .switch-btn {
            background: transparent;
            color: #c4b5fd;
            padding: 5px !important;
        }

        .switch-text {
            margin-top: 20px;
        }

        .divider {
            text-align: center;
            color: #94a3b8;
            margin: 20px 0 5px;
        }
    </style>
</head>

<body>

<header class="top-header">
    <div class="brand">
        <span class="brand-logo">♾️</span>
        <h2>SkillSwap</h2>
    </div>
    <a href="index.html">← Back to Home</a>
</header>

<main class="auth-wrapper">
    <section class="auth-box">

        <h1>♾️ SkillSwap</h1>
        <p>Learn Together. Grow Together.</p>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <h2>Sign In</h2>

            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter your password" required>

            <button type="submit" class="primary-btn">
                Login to Account →
            </button>
        </form>

        <div id="loginExtras">
            <div class="divider">OR</div>

            <button type="button" id="googleLoginButton"
                    class="google-btn">
                Continue with Google
            </button>

            <p class="switch-text">
                Don't have an account?
                <button type="button" id="openRegister"
                        class="switch-btn">
                    Create Account
                </button>
            </p>
        </div>

        <!-- REGISTER FORM -->
        <form id="registerForm" hidden>
            <h2>Create Your Account</h2>

            <label for="registerName">Full Name</label>
            <input type="text" id="registerName"
                   placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>

            <label for="registerPassword">Create Password</label>
            <input type="password" id="registerPassword"
                   placeholder="Minimum 6 characters"
                   minlength="6" required>

            <button type="submit" class="primary-btn">
                Create Account →
            </button>

            <p class="switch-text">
                Already have an account?
                <button type="button" id="openLogin"
                        class="switch-btn">
                    Sign In
                </button>
            </p>
        </form>

    </section>
</main>

<footer>
    <p>© 2026 SkillSwap | Learn Together. Grow Together.</p>
</footer>

<script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginExtras = document.getElementById("loginExtras");

    document.getElementById("openRegister").addEventListener("click", function() {
        loginForm.hidden = true;
        loginExtras.hidden = true;
        registerForm.hidden = false;
    });

    document.getElementById("openLogin").addEventListener("click", function() {
        registerForm.hidden = true;
        loginForm.hidden = false;
        loginExtras.hidden = false;
    });
</script>

<script type="module" src="./firebase-auth.js"></script>

</body>
</html>
