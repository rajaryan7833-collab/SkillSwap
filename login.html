<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>SkillSwap | Welcome</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-wrapper {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-box {
            width: 100%;
            max-width: 460px;
            padding: 35px;
            background: linear-gradient(145deg,#171e36,#101629);
            border: 1px solid rgba(167,139,250,.3);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .auth-logo {
            text-align: center;
            font-size: 42px;
        }

        .auth-box h1 {
            text-align: center;
            font-size: 30px;
            margin: 10px 0;
        }

        .auth-subtitle {
            text-align: center;
            color: #a5b4cf;
            margin-bottom: 25px;
        }

        .auth-box form {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .auth-box label {
            color: #dbeafe;
            font-size: 14px;
        }

        .auth-box input {
            width: 100%;
        }

        .auth-box form button {
            padding: 13px;
            margin-top: 8px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
        }

        .auth-switch button {
            background: none;
            color: #c4b5fd;
            border: none;
            font-weight: bold;
        }

        .google-login-btn {
            width: 100%;
            padding: 13px;
            background: white !important;
            color: #202124 !important;
            border: 1px solid #ddd !important;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .google-login-btn span {
            color: #4285f4;
            font-size: 20px;
            font-weight: 900;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            margin: 20px 0;
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #303b5a;
        }

        @media(max-width:480px) {
            .auth-box { padding: 25px 19px; }
        }
    </style>
</head>

<body>

<header class="top-header">
    <div class="brand">
        <span class="brand-logo">♾️</span>
        <h2>SkillSwap</h2>
    </div>
    <a href="index.html">← Back to Home</a>
</header>

<main class="auth-wrapper">

    <section class="auth-box">

        <div class="auth-logo">♾️</div>
        <h1>Welcome to SkillSwap</h1>
        <p class="auth-subtitle">Learn Together. Grow Together.</p>

        <form id="loginForm">
            <h2>Sign In</h2>

            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail"
                placeholder="Enter your email" autocomplete="email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password" required>

            <button type="submit">Login to Account →</button>
        </form>

        <div class="auth-divider">OR</div>

        <button type="button" id="googleLoginButton"
            class="google-login-btn">
            <span>G</span> Continue with Google
        </button>

        <p class="auth-switch" id="loginSwitch">
            Don't have an account?
            <button type="button" onclick="showRegister()">Create Account</button>
        </p>

        <form id="registerForm" hidden>
            <h2>Create Your Account</h2>

            <label for="registerName">Full Name</label>
            <input type="text" id="registerName"
                placeholder="Enter your full name"
                autocomplete="name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                placeholder="Enter your email"
                autocomplete="email" required>

            <label for="registerPassword">Create Password</label>
            <input type="password" id="registerPassword"
                placeholder="Minimum 6 characters"
                minlength="6" autocomplete="new-password" required>

            <button type="submit">Create Account →</button>

            <p class="auth-switch">
                Already have an account?
                <button type="button" onclick="showLogin()">Sign In</button>
            </p>
        </form>

    </section>
</main>

<footer>
    <p>© 2026 SkillSwap | Learn Together. Grow Together.</p>
</footer>

<script src="script.js"></script>
<script type="module" src="firebase-auth.js"></script>

</body>
</html>
